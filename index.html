  body {
    font-family: 'Share Tech Mono', 'Courier New', monospace;

  a.btn {

    background: #12161f; border: 1px solid #2a3040; color: #a0b0c8;
    padding: 16px 18px; text-align: left;
  }
  a.btn:hover, a.btn:active {
    background: #1a2030; border-color: #4a5aff; color: #e0e8ff;
  }
  a.btn .label { display: block; font-size: 14px; letter-spacing: 2px; color: #7a8cff; margin-bottom: 4px; }
  a.btn .desc { font-size: 12px; color: #5a6a80; line-height: 1.45; }
