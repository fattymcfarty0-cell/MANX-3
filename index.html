   z-index: 10; display: none; pointer-events: none; max-width: 90%; text-align: center;\n  }\n  #crosshair3d {\n    position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;\n    margin: -3px 0 0 -3px; border: 1px solid rgba(180,200,255,0.45);\n    border-radius: 50%; pointer-events: none; z-index: 10; display: none;\n  }\n  #fade3d {\n    position: absolute; inset: 0; background: #000; opacity: 0;\n    pointer-events: none; z-index: 30; transition: opacity 0.9s ease;\n  }\n  #fade3d.active { opacity: 1; }\n  #elevator-ui {\n    position: absolute; inset: 0; z-index: 25;\n    display: none; justify-content: center; align-items: center;\n    background: rgba(5,8,12,0.88);\n  }\n  #elevator-ui.visible { display: flex; }\n  #elevator-panel {\n    background: #0d0f18; border: 2px solid #2a3040;\n    padding: 24px 28px; min-width: 260px; text-align: center;\n  }\n  #elevator-panel h3 { color: #7a8cff; font-size: 14px; letter-spacing: 2px; margin-bottom: 16px; }\n  #elevator-panel button {\n    display: block; width: 100%; margin: 8px 0;\n    background: #151822; border: 1px solid #2a3040;\n    color: #a0b0c8; padding: 12px; font-family: inherit; font-size: 13px; cursor: pointer;\n  }\n  #elevator-panel button:hover { border-color: #4a5aff; color: #e0e8ff; }\n  #elevator-panel .note { color: #5a6a80; font-size: 11px; margin-top: 12px; }\n  #elevator-panel .close-el { margin-top: 14px; border-color: #3a3040; color: #807070; }\n  #mobile3d {\n    position: absolute; inset: 0; pointer-events: none; z-index: 15; display: none;\n  }\n  #mobile3d.visible { display: block; }\n  .joy-zone {\n    position: absolute; bottom: 28px; left: 20px; width: 120px; height: 120px;\n    pointer-events: auto; touch-action: none;\n  }\n  .joy-base {\n    width: 100px; height: 100px; border-radius: 50%;\n    background: rgba(20,25,40,0.55); border: 2px solid rgba(100,120,180,0.35);\n    position: absolute; top: 10px; left: 10px;\n  }\n  .joy-stick {\n    width: 46px; height: 46px; border-radius: 50%;\n    background: rgba(90,120,220,0.55); border: 2px solid rgba(140,170,255,0.6);\n    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);\n  }\n  #interact3d {\n    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);\n    width: 64px; height: 64px; border-radius: 50%;\n    background: rgba(30,40,70,0.75); border: 2px solid #4a5aff;\n    color: #a0b8ff; font-family: inherit; font-size: 18px;\n    pointer-events: auto; display: none; align-items: center; justify-content: center;\n  }\n  #interact3d.visible { display: flex; }\n</style>\n</head>\n<body>\n\n<div id=\"title-card\">\n  <h1>MANX CO, LTD</h1>\n  <div class=\"line\"></div>\n  <p>AFTER THE GOOD ENDING<br><br>You left with the key.<br>Someone noticed.</p>\n  <p style=\"margin-top:28px;color:#7a8cff;font-size:12px;letter-spacing:2px;cursor:pointer\">TAP TO BEGIN</p>\n</div>\n\n<div id=\"stage\">\n  <div id=\"location\">WEST JORDAN // <span>INTERVIEW ROOM 3</span></div>\n  <div id=\"room\">\n    <div id=\"dialogue-box\">\n      <div class=\"speaker det\" id=\"speaker\">DET. HALE</div>\n      <div id=\"dialogue-text\"></div>\n    </div>\n  </div>\n  <div id=\"continue-hint\">TAP / CLICK TO CONTINUE</div>\n  <div id=\"choices\"></div>\n</div>\n\n<div id=\"end-card\">\n  <h2 id=\"end-title\">END OF TEST CUTSCENE</h2>\n  <p id=\"end-body\">The interview is not over.<br><br>Session suspended.</p>\n</div>\n\n<div id=\"world\">\n  <div id=\"canvas-container\"></div>\n  <div id=\"crosshair3d\"></div>\n  <div id=\"hud3d\">\n    <span id=\"hud-loc\">MANX LOBBY // PUBLIC LEVEL</span><br>\n    <span id=\"hud-sub\">DET. HALE IS WITH YOU</span>\n    <div class=\"item\" id=\"hud-item\"></div>\n  </div>\n  <div id=\"prompt3d\"></div>\n  <div id=\"fade3d\"></div>\n  <div id=\"elevator-ui\">\n    <div id=\"elevator-panel\">\n      <h3>ELEVATOR</h3>\n      <button data-floor=\"1\">1 \u2014 Lobby</button>\n      <button data-floor=\"6\">6 \u2014 Offices</button>\n      <button data-floor=\"7\" id=\"btn-floor7\">7 \u2014 Sublevel</button>\n      <div class=\"note\" id=\"el-note\">Staff key required for restricted floors</div>\n      <button class=\"close-el\" id=\"close-elevator\">Close</button>\n    </div>\n  </div>\n  <div id=\"mobile3d\">\n    <div class=\"joy-zone\" id=\"joy3d\">\n      <div class=\"joy-base\"><div class=\"joy-stick\" id=\"stick3d\"></div></div>\n    </div>\n    <button id=\"interact3d\">E</button>\n  </div>\n</div>\n\n<script>\nconst isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);\nconst $ = id => document.getElementById(id);\n\nfunction loadThree(cb) {\n  if (window.THREE) { cb(); return; }\n  const urls = [\n    'https://unpkg.com/three@0.160.0/build/three.min.js',\n    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',\n    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'\n  ];\n  let i = 0;\n  function tryNext() {\n    if (i >= urls.length) {\n      alert('Could not load 3D engine. Check your connection and try again.');\n      return;\n    }\n    const s = document.createElement('script');\n    s.src = urls[i++];\n    s.onload = () => cb();\n    s.onerror = () => tryNext();\n    document.head.appendChild(s);\n  }\n  tryNext();\n}\n\nfunction dismissTitle() {\n  const tc = $('title-card');\n  if (!tc || tc.classList.contains('hidden')) return;\n  tc.classList.add('fade');\n  setTimeout(() => {\n    tc.classList.add('hidden');\n    playCurrent();\n  }, 500);\n}\n\nconst textEl = $('dialogue-text');\nconst speakerEl = $('speaker');\nconst choicesEl = $('choices');\nconst hintEl = $('continue-hint');\n\nlet typing = false, waitingContinue = false, sceneIndex = 0, typeTimer = null;\nlet goToBuilding = false, impatientEnding = false;\n\nconst script = [\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'Interview starts at 21:14. Subject declined counsel.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'State your name for the record  'line', speaker: 'DET. HALE', cls: 'det', text: 'There is no forwarding address. There is no second record.' },\n  { type: 'goto', to: 'pressure' },\n  { id: 'story_floor', type: 'line', speaker: 'YOU', cls: 'you', text: 'You tell him Floor 7 / Sublevel does not appear on public plans.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'We pulled facilities drawings this morning. They stop at six.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'MANX legal already called. They say you\\'re confused. Exhausted. Mistaken.' },\n  { id: 'pressure', type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'A missing persons unit has twelve open files tied to that building since 1989. All closed as voluntary resignation.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'You\\'re the first one who walked out carrying something that still opens a door.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'Will you take us back in?' },\n  { type: 'choice', options: [\n    { label: 'Yes. I\\'ll show you.', next: 'yes' },\n    { label: 'Not yet.', next: 'not_yet' },\n    { label: 'You won\\'t like what\\'s under Floor 7.', next: 'warn' }\n  ]},\n  { id: 'yes', type: 'line', speaker: 'YOU', cls: 'you', text: 'You nod. The key is still cold in the evidence bag between you.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'Then we go now. Officially it\\'s a welfare check.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'Stay close. And if that key still works \u2014 we document everything.' },\n  { type: 'line', speaker: 'SYSTEM', cls: 'sys', text: 'Morning. MANX lobby. The public face of the building is still smiling.' },\n  { type: 'enter3d' },\n  { id: 'not_yet', type: 'line', speaker: 'YOU', cls: 'you', text: 'You shake your head. Not tonight.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'We can hold the key. We can\\'t hold you. Yet.' },\n  { type: 'goto', to: 'closing' },\n  { id: 'warn', type: 'line', speaker: 'YOU', cls: 'you', text: 'You tell him Floor 7 is where problems are moved.' },\n  { type: 'line', speaker: 'DET. HALE', cls: 'det', text: 'He writes that down. Call me when you\\'re ready to walk us in.' },\n  { id: 'closing', type: 'line', speaker: 'SYSTEM', cls: 'sys', text: 'Interview paused. The key remains in custody.' },\n  { type: 'end' }\n];\nconst byId = {};\nscript.forEach((s, i) => { if (s.id) byId[s.id] = i; });\n\nfunction setSpeaker(name, cls) {\n  speakerEl.textContent = name;\n  speakerEl.className = 'speaker ' + (cls || 'det');\n}\nfunction typeText(text, cb) {\n  typing = true; textEl.textContent = '';\n  hintEl.classList.remove('visible');\n  choicesEl.classList.remove('visible'); choicesEl.innerHTML = '';\n  let i = 0; clearInterval(typeTimer);\n  typeTimer = setInterval(() => {\n    if (i >= text.length) { clearInterval(typeTimer); typing = false; if (cb) cb(); return; }\n    textEl.textContent += text[i++];\n  }, 18);\n}\nfunction showChoices(options) {\n  typing = false; waitingContinue = false; hintEl.classList.remove('visible');\n  choicesEl.innerHTML = '';\n  options.forEach(opt => {\n    const btn = document.createElement('button');\n    btn.className = 'choice'; btn.textContent = opt.label;\n    btn.onclick = () => {\n      choicesEl.classList.remove('visible');\n      if (opt.next === 'yes') goToBuilding = true;\n      if (opt.next === 'not_yet' || opt.next === 'warn') impatientEnding = true;\n      jumpTo(opt.next);\n    };\n    choicesEl.appendChild(btn);\n  });\n  choicesEl.classList.add('visible');\n}\nfunction jumpTo(id) { if (byId[id] !== undefined) { sceneIndex = byId[id]; playCurrent(); } }\nfunction showEndCard() {\n  if (impatientEnding) {\n    $('end-title').textContent = 'IMPATIENT ENDING';\n    $('end-body').innerHTML = 'You decided not to go inside and held it off.<br><br>The key stays with the department.<br>Floor 7 stays dark \u2014 for now.';\n  } else {\n    $('end-title').textContent spacing: 1px;\n    pointer-events: auto; touch-action: none;\n  }\n  #crouch-btn.active { background: rgba(60,40,80,0.9); border-color: #c080ff; }\n</style>\n</head>\n<body>\n\n<div id=\"boot\">\n  <h1>MANX \u2014 AFTER // PART 2</h1>\n  <p>The hatch opened onto more building than maps allow.<br><br>\n  Lobby is safe. Beyond it \u2014 the residue keeps growing.<br><br>\n  Hide. Move. The goal never stops.</p>\n  <button id=\"start-btn\">ENTER LOBBY</button>\n</div>\n\n<div id=\"canvas-wrap\"></div>\n<div id=\"crosshair\"></div>\n<div id=\"hud\">\n  <span class=\"ok\" id=\"hud-zone\">LOBBY // SAFE</span><br>\n  <span id=\"hud-goal\">Goal: leave through the street door</span><br>\n  <span id=\"hud-depth\"></span>\n</div>\n<div id=\"prompt\"></div>\n<div id=\"spotted\"></div>\n<div id=\"gameover\">\n  <h2>DETECTED</h2>\n  <p>A residue unit found you. The corridor folds you back.</p>\n  <button id=\"retry-btn\">TRY AGAIN</button>\n</div>\n\n<div id=\"mobile\">\n  <div class=\"joy\" id=\"joy\"><div class=\"joy-base\"><div class=\"joy-stick\" id=\"stick\"></div></div></div>\n  <button id=\"crouch-btn\">HIDE</button>\n</div>\n\n<script>\nconst isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);\nconst $ = id => document.getElementById(id);\n\nlet scene, camera, renderer, root;\nlet pointerLocked = false;\nlet inLobby = true;\nlet crouching = false;\nlet gameOver = false;\nlet depth = 0;\nlet goalPos = null;\nlet exitDoor = null;\nlet monsters = [];\nlet coverProps = [];\nlet generatedChunks = new Set();\nconst CELL = 12;\nconst keys = { w:false, a:false, s:false, d:false };\nlet clock = null;\nlet euler = null;\nconst PI_2 = Math.PI / 2;\nconst mobile = { moveX:0, moveY:0, lookDX:0, lookDY:0 };\nlet touchLookId = null, touchLookLast = null;\n\nconst MOVE = 5.5;\nconst CROUCH_MOVE = 2.8;\nconst PLAYER_H = 1.6;\nconst CROUCH_H = 1.05;\n\nfunction loadThree(cb) {\n  if (window.THREE) { cb(); return; }\n  const urls = [\n    'https://unpkg.com/three@0.160.0/build/three.min.js',\n    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',\n    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'\n  ];\n  let i = 0;\n  function tryNext() {\n    if (i >= urls.length) {\n      alert('Could not load 3D engine. Check your connection and try again.');\n      return;\n    }\n    const s = document.createElement('script');\n    s.src = urls[i++];\n    s.onload = () => cb();\n    s.onerror = () => tryNext();\n    document.head.appendChild(s);\n  }\n  tryNext();\n}\n\nfunction startPart2() {\n  const btn = $('start-btn');\n  if (btn) { btn.disabled = true; btn.textContent = 'LOADING\u2026'; }\n  loadThree(() => {\n    clock = new THREE.Clock();\n    euler = new THREE.Euler(0, 0, 0, 'YXZ');\n    goalPos = new THREE.Vector3(0, 0, -20);\n    $('boot').classList.add('fade');\n    setTimeout(() => {\n      $('boot').classList.add('hidden');\n      init();\n      if (!isTouch) {\n        $('crosshair').style.display = 'block';\n        setTimeout(() => renderer.domElement.requestPointerLock?.(), 150);\n      } else $('mobile').classList.add('visible');\n    }, 400);\n  });\n}\n\n$('start-btn').addEventListener('click', function(e) {\n  e.preventDefault();\n  startPart2();\n});\n$('start-btn').addEventListener('touchend', function(e) {\n  e.preventDefault();\n  startPart2();\n}, {passive:false});\n\n$('retry-btn').onclick = () => {\n  $('gameover').classList.remove('visible');\n  gameOver = false;\n  $('spotted').classList.remove('on');\n  // Reset to lobby\n  clearWorld();\n  inLobby = true;\n  depth = 0;\n  generatedChunks.clear();\n  monsters = [];\n  coverProps = [];\n  buildLobby();\n  camera.position.set(0, PLAYER_H, 6);\n  euler.set(0, 0, 0);\n  camera.quaternion.setFromEuler(euler);\n  updateHud();\n  if (!isTouch) setTimeout(() => renderer.domElement.requestPointerLock?.(), 100);\n};\n\nfunction init() {\n  scene = new THREE.Scene();\n  scene.background = new THREE.Color(0x1a1e28);\n  scene.fog = new THREE.Fog(0x1a1e28, 10, 38);\n\n  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 80);\n  camera.position.set(0, PLAYER_H, 6);\n\n  renderer = new THREE.WebGLRenderer({ antialias: false });\n  renderer.setSize(innerWidth, innerHeight);\n  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));\n  $('canvas-wrap').appendChild(renderer.domElement);\n\n  scene.add(new THREE.AmbientLight(0x5a6a88, 0.9));\n  const l = new THREE.PointLight(0xffffff, 1.2, 28);\n  l.position.set(0, 5, 2); scene.add(l);\n\n  root = new THREE.Group();\n  scene.add(root);\n\n  buildLobby();\n  setupInput();\n  if (isTouch) setupMobile();\n  animate();\n}\n\nfunction clearWorld() {\n  while (root.children.length) root.remove(root.children[0]);\n  monsters.forEach(m => { if (m.mesh) scene.remove(m.mesh); if (m.light) scene.remove(m.light); });\n  monsters = [];\n  coverProps = [];\n  exitDoor = null;\n}\n\nfunction box(w,h,d,color,x,y,z, parent) {\n  const m = new THREE.Mesh(\n    new THREE.BoxGeometry(w,h,d),\n    new THREE.MeshStandardMaterial({ color, roughness: 0.85 })\n  );\n  m.position.set(x,y,z);\n  (parent || root).add(m);\n  return m;\n}\n\nfunction buildLobby() {\n  clearWorld();\n  inLobby = true;\n  scene.background = new THREE.Color(0x1a1e28);\n  scene.fog = new THREE.Fog(0x1a1e28, 10, 38);\n\n  // Floor ceiling\n  const fl = new THREE.Mesh(new THREE.PlaneGeometry(24, 18), new THREE.MeshStandardMaterial({ color: 0x2a3040 }));\n  fl.rotation.x = -Math.PI/2; root.add(fl);\n  const cl = new THREE.Mesh(new THREE.PlaneGeometry(24, 18), new THREE.MeshStandardMaterial({ color: 0x222830 }));\n  cl.rotation.x = Math.PI/2; cl.position.y = 4.5; root.add(cl);\n\n  // Walls\n  box(24, 4.5, 0.3, 0x252a38, 0, 2.25, -8, root);\n  box(0.3, 4.5, 18, 0x252a38, -12, 2.25, 1, root);\n  box(0.3, 4.5, 18, 0x252a38, 12, 2.25, 1, root);\n  // Front with exit gap toward - wait: street behind is +z, infinite starts through back? \n  // User: leave lobby = real game. Use the LOGO wall door as exit into infinite (behind logo / -z)\n  // Actually street was +z. For part 2: the \"wrong\" path is through a side/service door into residue.\n  // Service door on back wall (-z) into infinite.\n\n  box(9, 4.5, 0.3, 0x252a38, -7.5, 2.25, 9, root);\n  box(9, 4.5, 0.3, 0x252a38, 7.5, 2.25, 9, root);\n  // street doors closed\n  box(2.8, 3.2, 0.15, 0x3a4558, 0, 1.6, 9, root);\n\n  // Logo\n  const c = document.createElement('canvas'); c.width = 512; c.height = 128;\n  const ctx = c.getContext('2d');\n  ctx.fillStyle = '#7a8cff'; ctx.font = 'bold 40px Courier New, monospace'; ctx.textAlign = 'center';\n  ctx.fillText('MANX CO, LTD', 256, 50);\n  ctx.fillStyle = '#8a9ab0'; ctx.font = '24px Courier New, monospace';\n  ctx.fillText('happy to help!', 256, 95);\n  const tp = new THREE.Mesh(new THREE.PlaneGeometry(4, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));\n  tp.position.set(0, 2.8, -7.8); root.add(tp);\n\n  // Desk\n  box(4, 1.0, 1.2, 0x2a3348, -5, 0.5, -5, root);\n\n  // SERVICE / RESIDUE door on back wall \u2014 leaving lobby\n  exitDoor = box(2.4, 3.0, 0.2, 0x2a2030, 5, 1.5, -7.85, root);\n  box(0.9, 2.6, 0.08, 0x3a3040, 4.5, 1.4, -7.7, root);\n  box(0.9, 2.6, 0.08, 0x3a3040, 5.5, 1.4, -7.7, root);\n  const sc = document.createElement('canvas'); sc.width = 256; sc.height = 64;\n  const sctx = sc.getContext('2d');\n  sctx.fillStyle = '#1a1520'; sctx.fillRect(0,0,256,64);\n  sctx.fillStyle = '#ff8a9a'; sctx.font = '18px Courier New, monospace'; sctx.textAlign = 'center';\n  sctx.fillText('SERVICE \u2014 NO ENTRY', 128, 40);\n  const sp = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc) }));\n  sp.position.set(5, 3.2, -7.7); root.add(sp);\n\n  const pl = new THREE.PointLight(0x6a8cff, 0.6, 12); pl.position.set(5, 3, -6); root.add(pl);\n\n  updateHud();\n}\n\nfunction chunkKey(cx, cz) { return cx + ',' + cz; }\n\nfunction generateChunk(cx, cz) {\n  const key = chunkKey(cx, cz);\n  if (generatedChunks.has(key)) return;\n  generatedChunks.add(key);\n\n  const ox = cx * CELL;\n  const oz = cz * CELL;\n  const group = new THREE.Group();\n  root.add(group);\n\n  // Floor\n  const fl = new THREE.Mesh(\n    new THREE.PlaneGeometry(CELL - 0.15, CELL - 0.15),\n    new THREE.MeshStandardMaterial({ color: 0x141820 + (Math.random()*0x080808)|0, roughness: 0.9 })\n  );\n  fl.rotation.x = -Math.PI/2;\n  fl.position.set(ox, 0, oz);\n  group.add(fl);\n\n  // Ceiling sometimes\n  if (Math.random() > 0.2) {\n    const cl = new THREE.Mesh(\n      new THREE.PlaneGeometry(CELL - 0.15, CELL - 0.15),\n      new THREE.MeshStandardMaterial({ color: 0x0e1016 })\n    );\n    cl.rotation.x = Math.PI/2;\n    cl.position.set(ox, 3.8, oz);\n    group.add(cl);\n  }\n\n  // Walls with openings\n  const h = 3.8;\n  function wallSeg(x, y, z, w, d) {\n    const m = new THREE.Mesh(\n      new THREE.BoxGeometry(w, h, d),\n      new THREE.MeshStandardMaterial({ color: 0x1a2030, roughness: 0.9 })\n    );\n    m.position.set(x, y, z); group.add(m);\n  }\n  // North\n  if (Math.random() > 0.25) {\n    wallSeg(ox - CELL*0.28, h/2, oz - CELL/2, CELL*0.35, 0.25);\n    wallSeg(ox + CELL*0.28, h/2, oz - CELL/2, CELL*0.35, 0.25);\n  } else wallSeg(ox, h/2, oz - CELL/2, CELL, 0.25);\n  // South\n  if (Math.random() > 0.25) {\n    wallSeg(ox - CELL*0.28, h/2, oz + CELL/2, CELL*0.35, 0.25);\n    wallSeg(ox + CELL*0.28, h/2, oz + CELL/2, CELL*0.35, 0.25);\n  } else wallSeg(ox, h/2, oz + CELL/2, CELL, 0.25);\n  // West\n  if (Math.random() > 0.25) {\n    wallSeg(ox - CELL/2, h/2, oz - CELL*0.28, 0.25, CELL*0.35);\n    wallSeg(ox - CELL/2, h/2, oz + CELL*0.28, 0.25, CELL*0.35);\n  } else wallSeg(ox - CELL/2, h/2, oz, 0.25, CELL);\n  // East\n  if (Math.random() > 0.25) {\n    wallSeg(ox + CELL/2, h/2, oz - CELL*0.28, 0.25, CELL*0.35);\n    wallSeg(ox + CELL/2, h/2, oz + CELL*0.28, 0.25, CELL*0.35);\n  } else wallSeg(ox + CELL/2, h/2, oz, 0.25, CELL);\n\n  // Cover props\n  const nProps = 1 + (Math.random()*3)|0;\n  for (let i = 0; i < nProps; i++) {\n    const px = ox + (Math.random()-0.5)*CELL*0.6;\n    const pz = oz + (Math.random()-0.5)*CELL*0.6;\n    const pw = 0.8 + Math.random()*1.2;\n    const ph = 0.9 + Math.random()*1.4;\n    const pd = 0.6 + Math.random()*1.0;\n    const prop = box(pw, ph, pd, 0x2a3040, px, ph/2, pz, group);\n    coverProps.push({ mesh: prop, r: Math.max(pw, pd) * 0.7 });\n  }\n\n  // Monster chance (not too close to lobby start)\n  if (cz < -1 && Math.random() > 0.55) {\n    spawnMonster(ox + (Math.random()-0.5)*4, oz + (Math.random()-0.5)*4);\n  }\n\n  // Moving goal further out\n  if (cz < -depth) {\n    depth = Math.max(depth, -cz);\n  }\n}\n\nfunction spawnMonster(x, z) {\n  const body = new THREE.Mesh(\n    new THREE.BoxGeometry(0.7, 1.8, 0.5),\n    new THREE.MeshStandardMaterial({ color: 0x1a1018, roughness: 0.7 })\n  );\n  body.position.set(x, 0.9, z);\n  scene.add(body);\n  const head = new THREE.Mesh(\n    new THREE.BoxGeometry(0.4, 0.4, 0.4),\n    new THREE.MeshStandardMaterial({ color: 0x2a1520 })\n  );\n  head.position.set(0, 1.15, 0);\n  body.add(head);\n  const eye = new THREE.Mesh(\n    new THREE.BoxGeometry(0.35, 0.08, 0.1),\n    new THREE.MeshBasicMaterial({ color: 0xff3355 })\n  );\n  eye.position.set(0, 1.2, 0.25);\n  body.add(eye);\n  const light = new THREE.PointLight(0xff2244, 0.45, 6);\n  light.position.set(x, 1.5, z);\n  scene.add(light);\n\n  monsters.push({\n    mesh: body,\n    light,\n    x, z,\n    angle: Math.random() * Math.PI * 2,\n    state: 'patrol', // patrol | chase | search\n    speed: 2.2 + Math.random() * 1.2,\n    sight: 9,\n    patrolT: Math.random() * 10\n  });\n}\n\nfunction ensureChunksAround(px, pz) {\n  const cx = Math.round(px / CELL);\n  const cz = Math.round(pz / CELL);\n  for (let dz = -2; dz <= 2; dz++) {\n    for (let dx = -2; dx <= 2; dx++) {\n      generateChunk(cx + dx, cz + dz);\n    }\n  }\n}\n\nfunction leaveLobby() {\n  if (!inLobby) return;\n  inLobby = false;\n  // Tear lobby, start infinite at service door\n  clearWorld();\n  scene.background = new THREE.Color(0x0c0e14);\n  scene.fog = new THREE.Fog(0x0c0e14, 6, 28);\n  scene.add(new THREE.AmbientLight(0x3a4050, 0.55));\n  const l = new THREE.PointLight(0x6688aa, 0.7, 20);\n  l.position.set(0, 4, 0); scene.add(l);\n\n  camera.position.set(5, PLAYER_H, -10);\n  generatedChunks.clear();\n  ensureChunksAround(camera.position.x, camera.position.z);\n  goalPos.set(0, 0, camera.position.z - 40);\n  updateHud();\n  showPrompt('You left the lobby. Do not be seen.', 3500);\n}\n\nfunction updateHud() {\n  if (inLobby) {\n    $('hud-zone').textContent = 'LOBBY // SAFE';\n    $('hud-zone').className = 'ok';\n    $('hud-goal').textContent = 'Goal: SERVICE door (back right)';\n    $('hud-depth').textContent = '';\n  } else {\n    $('hud-zone').textContent = 'RESIDUE // UNSAFE';\n    $('hud-zone').className = 'warn';\n    $('hud-goal').textContent = 'Goal shifts deeper. Keep moving.';\n    $('hud-depth').textContent = 'Depth ' + Math.floor(depth);\n  }\n}\n\nfunction showPrompt(t, ms) {\n  $('prompt').textContent = t;\n  $('prompt').style.display = 'block';\n  setTimeout(() => { $('prompt').style.display = 'none'; }, ms || 2500);\n}\n\nfunction isHidden() {\n  if (!crouching) return false;\n  // Near a cover prop?\n  for (const c of coverProps) {\n    if (!c.mesh) continue;\n    const d = camera.position.distanceTo(c.mesh.position);\n    if (d < c.r + 1.1) return true;\n  }\n  return false;\n}\n\nfunction updateMonsters(delta) {\n  if (inLobby || gameOver) return;\n  let anyChase = false;\n  const hidden = isHidden();\n\n  monsters.forEach(m => {\n    const dx = camera.position.x - m.mesh.position.x;\n    const dz = camera.position.z - m.mesh.position.z;\n    const dist = Math.sqrt(dx*dx + dz*dz);\n\n    // Line of sight: facing player roughly\n    const faceX = Math.sin(m.angle);\n    const faceZ = Math.cos(m.angle);\n    const nx = dist > 0.01 ? dx/dist : 0;\n    const nz = dist > 0.01 ? dz/dist : 0;\n    const dot = faceX * nx + faceZ * nz;\n    const canSee = dist < m.sight && dot > 0.35 && !hidden;\n\n    if (canSee) {\n      m.state = 'chase';\n      anyChase = true;\n    } else if (m.state === 'chase' && dist > m.sight * 1.3) {\n      m.state = 'search';\n      m.patrolT = 3;\n    }\n\n    if (m.state === 'chase') {\n      m.angle = Math.atan2(dx, dz);\n      const sp = m.speed * 1.35 * delta;\n      m.mesh.position.x += nx * sp;\n      m.mesh.position.z += nz * sp;\n      if (dist < 1.3 && !hidden) {\n        triggerDetected();\n      }\n    } else if (m.state === 'search') {\n      m.patrolT -= delta;\n      m.angle += delta * 1.5;\n      if (m.patrolT <= 0) m.state = 'patrol';\n    } else {\n      // patrol\n      m.patrolT += delta;\n      m.angle += Math.sin(m.patrolT * 0.7) * 0.4 * delta;\n      m.mesh.position.x += Math.sin(m.angle) * m.speed * 0.45 * delta;\n      m.mesh.position.z += Math.cos(m.angle) * m.speed * 0.45 * delta;\n    }\n\n    m.mesh.rotation.y = m.angle;\n    if (m.light) {\n      m.light.position.copy(m.mesh.position);\n      m.light.position.y = 1.5;\n      m.light.intensity = m.state === 'chase' ? 1.1 : 0.45;\n    }\n  });\n\n  $('spotted').classList.toggle('on', anyChase);\n}\n\nfunction triggerDetected() {\n  if (gameOver) return;\n  gameOver = true;\n  document.exitPointerLock?.();\n  $('gameover').classList.add('visible');\n}\n\nfunction setupInput() {\n  document.addEventListener('keydown', e => {\n    if (e.code==='KeyW') keys.w=true;\n    if (e.code==='KeyA') keys.a=true;\n    if (e.code==='KeyS') keys.s=true;\n    if (e.code==='KeyD') keys.d=true;\n    if (e.code==='KeyC' || e.code==='ControlLeft') crouching = true;\n    if (e.code==='KeyE') tryInteract();\n  });\n  document.addEventListener('keyup', e => {\n    if (e.code==='KeyW') keys.w=false;\n    if (e.code==='KeyA') keys.a=false;\n    if (e.code==='KeyS') keys.s=false;\n    if (e.code==='KeyD') keys.d=false;\n    if (e.code==='Ke =0}\n  zone.addEventListener('touchstart',handle,{passive:false});zone.addEventListener('touchmove',handle,{passive:false});zone.addEventListener('touchend',end);\n  $('act-btn').addEventListener('touchstart',e=>{e.preventDefault();tryAct()},{passive:false});\n  document.addEventListener('touchstart',e=>{for(const t of e.changedTouches){const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&(el.closest('#joy')||el.closest('#act-btn')))continue;if(touchLookId===null){touchLookId=t.identifier;touchLookLast={x:t.clientX,y:t.clientY}}}},{passive:true});\n  document.addEventListener('touchmove',e=>{if(touchLookId===null||lyingDown)return;for(const t of e.changedTouches){if(t.identifier!==touchLookId)continue;mobile.lookDX+=t.clientX-touchLookLast.x;mobile.lookDY+=t.clientY-touchLookLast.y;touchLookLast={x:t.clientX,y:t.clientY}}},{passive:true});\n  document.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===touchLookId){touchLookId=null;touchLookLast=null}}});\n}\nfunction animate(){\n  requestAnimationFrame(animate);\n  if(!gameStarted||!camera)return;\n  if(gameOver){renderer.render(scene,camera);return}\n  const delta=Math.min(clock.getDelta(),.05);\n  if(!lyingDown&&isTouch&&(mobile.lookDX||mobile.lookDY)){\n    euler.setFromQuaternion(camera.quaternion);euler.y-=mobile.lookDX*.0045;euler.x-=mobile.lookDY*.0045;\n    euler.x=Math.max(-1.2,Math.min(1.2,euler.x));camera.quaternion.setFromEuler(euler);mobile.lookDX=0;mobile.lookDY=0;\n  }\n  if(!lyingDown){\n    const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();\n    const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();\n    const speed=4.2*delta;let mx=0,mz=0;\n    if(!isTouch&&pointerLocked){if(keys.w){mx+=forward.x;mz+=forward.z}if(keys.s){mx-=forward.x;mz-=forward.z}if(keys.a){mx-=right.x;mz-=right.z}if(keys.d){mx+=right.x;mz+=right.z}}\n    else if(isTouch){mx=forward.x*(-mobile.moveY)+ri function play(html, label) {
  var status = document.getElementById('status');
  if (status) status.textContent = 'Loading ' + label + '…';
  try {
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    window.location.href = url;
  } catch (err) {
    if (status) status.textContent = 'Load failed. Try again.';
    console.error(err);
  }
}
